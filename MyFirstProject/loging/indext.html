<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <div class="logo-icon">
                <i class="bi bi-person-circle"></i>
            </div>
            <h1>Login</h1>
        </div>
        
        <p>Welcome back! Please enter your details.</p>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email or Username</label>
                <input type="text" id="email" placeholder="Enter your email or username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">👁️</button>
                </div>
            </div>
            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember">
                    Remember me
                </label>
                <a href="#" class="forgot">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Sign in</button>
            <p id="formMessage" class="error" role="alert"></p>
        </form>
    </div>
</body>

<script>
    const passwordField = document.getElementById('password');
    const toggleButton = document.querySelector('.toggle-password');
    const form = document.getElementById('loginForm');
    const message = document.getElementById('formMessage');
    const submitButton = document.querySelector('.login-btn');

    function togglePassword() {
        if (!passwordField) return;

        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            toggleButton.textContent = '🙈';
        } else {
            passwordField.type = 'password';
            toggleButton.textContent = '👁️';
        }
    }

    if (toggleButton) {
        toggleButton.addEventListener('click', togglePassword);
    }

    if (form) {
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            if (message) {
                message.style.display = 'block';
                message.textContent = 'Login form submitted successfully!';
            }

            if (submitButton) {
                submitButton.textContent = 'Signing in...';
                submitButton.disabled = true;

                setTimeout(() => {
                    submitButton.textContent = 'Sign in';
                    submitButton.disabled = false;
                }, 1200);
            }
        });
    }
</script>

</html>
