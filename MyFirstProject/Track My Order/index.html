<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Track My Order</title>
    <link rel="stylesheet" href="../globle.css" />
    <link rel="stylesheet" href="indext.css" />
  </head>
  <body>
    <div id="navBar-2"></div>

    <div class="container" id="background">
      <div class="breadcrumb">
        <a
          href="/MyFirstProject/home/index.html"
          style="color: gray; text-decoration: none"
        >
          Home
        </a>
        > <span>Track My Order</span>
      </div>

      <div class="text-container">
        <h1 class="title">Track My Order</h1>
        <h2 class="subtitle">
          To track your order please enter your Tracking ID in the box below and
          press the "Track" button. This was given to you on your receipt and in
          the confirmation email you should have received.
        </h2>

        <div class="login">
          <input
            type="text"
            id="tracking-id"
            placeholder="Enter your order ID"
          />
          <button id="track-btn">Track</button>
        </div>
      </div>
    </div>

    <div id="footer"></div>

    <script>
      // Load Navbar
      const navbar = document.getElementById("navBar-2");
      if (navbar) {
          fetch("../navBar.html")
              .then(response => {
                  if (!response.ok) throw new Error("Failed to load navbar");
                  return response.text();
              })
              .then(html => navbar.innerHTML = html)
              .catch(error => {
                  navbar.textContent = "Navigation unavailable.";
                  console.error(error);
              });
      }

      // Load Footer
      const footer = document.getElementById("footer");
      if (footer) {
          fetch("../footer.html")
              .then(response => {
                  if (!response.ok) throw new Error("Failed to load footer");
                  return response.text();
              })
              .then(html => footer.innerHTML = html)
              .catch(error => {
                  footer.textContent = "Footer unavailable.";
                  console.error(error);
              });
      }

      // Track Button Functionality (Placeholder)
      const trackBtn = document.getElementById("track-btn");
      const trackingInput = document.getElementById("tracking-id");

      trackBtn.addEventListener("click", () => {
          window.location.href = "/MyFirstProject/loging/indext.html";
          });

       

      // Allow pressing Enter key
      trackingInput.addEventListener("keypress", (e) => {
          if (e.key === "Enter") trackBtn.click();
      });
    </script>
  </body>
</html>
